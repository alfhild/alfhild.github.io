<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Not found | {{ company.legal_name }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
{% render "base.css" -%}
    p,
    pre {
      overflow-wrap: anywhere;
    }
    pre {
      font: inherit;
      white-space: pre-wrap;
    }
    .prompt {
      color: var(--marker);
    }
  </style>
</head>
<body>
  <h1>Not found</h1>
  <pre><span class="prompt">&gt;</span> bat <span class="path">/that/path</span>
[bat error]: '<span class="path">/that/path</span>': No such file or directory (os error 2)</pre>
  <p>
    Likely causes: it was descoped, it was never in scope, or there is a typo.
    Possibly mine.
  </p>
  <p><a href="/">Back to alfhild.io</a></p>

  <script>
    for (const path of document.querySelectorAll(".path")) {
      path.textContent = location.pathname;
    }
  </script>
</body>
</html>
