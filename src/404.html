<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Not found | {{legalName}}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: light dark;
      --bg: light-dark(#fbf1c7, #282828);
      --fg: light-dark(#4f3829, #d4be98);
      --link: light-dark(#266b79, #7daea3);
      --marker: light-dark(#c35e0a, #e78a4e);
      --gap: clamp(2em, 6.4vw, 5em);
    }

    body {
      font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
      font-size: .975rem;
      word-spacing: -.1em;
      line-height: 1.6;

      box-sizing: border-box;
      width: 40em;
      max-width: 100%;
      margin: var(--gap) auto;
      padding: 0 1em;

      color: var(--fg);
      background: var(--bg);
    }
    a {
      color: var(--link);
    }
    p,
    pre {
      overflow-wrap: anywhere;
    }
    pre {
      font: inherit;
      white-space: pre-wrap;
    }
    .prompt {
      color: var(--marker);
    }
    h1 {
      font-size: 1.5em;
    }
    h1::before {
      content: "#\00a0" / "";
      color: var(--marker);
    }
  </style>
</head>
<body>
  <h1>Not found</h1>
  <pre><span class="prompt">&gt;</span> bat <span class="path">/that/path</span>
[bat error]: '<span class="path">/that/path</span>': No such file or directory (os error 2)</pre>
  <p>
    Likely causes: it was descoped, it was never in scope, or there is a typo.
    Possibly mine.
  </p>
  <p><a href="/">Back to alfhild.io</a></p>

  <script>
    for (const path of document.querySelectorAll(".path")) {
      path.textContent = location.pathname;
    }
  </script>
</body>
</html>
